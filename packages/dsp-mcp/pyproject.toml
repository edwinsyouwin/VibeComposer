[project]
name = "dsp-mcp"
version = "0.1.0"
description = "Wavetable synthesizer and audio processor exposed as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.3.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "pydantic>=2.0",
]

[project.scripts]
dsp-mcp = "dsp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
